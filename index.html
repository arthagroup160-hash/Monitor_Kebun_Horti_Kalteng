<script>
var DEF=[
{id:'timun',n:'Timun',e:'🥒',w:1,f:10,s:1,fn:'NPK + kalium saat berbunga; kompos; siram setelahnya',wn:'Siram pagi di pangkal, tanah lembap tidak becek'},
{id:'terongungu',n:'Terong Ungu',e:'🍆',w:1,f:14,s:1,fn:'NPK seimbang, tambah kalium saat berbuah + kompos',wn:'Siram di pangkal, tanah lembap tidak becek'},
{id:'tomat',n:'Tomat',e:'🍅',w:1,f:10,s:1,fn:'NPK + kalsium + kalium saat berbuah',wn:'Siram pagi di pangkal, jangan basahi daun, hindari kering-basah mendadak'},
{id:'cabe',n:'Cabe',e:'🌶️',w:1,f:14,s:1,fn:'NPK + kalium saat berbunga/berbuah',wn:'Siram pagi di pangkal, lembap tidak tergenang'},
{id:'kangkung',n:'Kangkung',e:'🌿',w:1,f:10,s:1,fn:'Nitrogen (urea/kompos cair) untuk daun',wn:'Siram tiap hari, tanah selalu lembap'},
{id:'bayam',n:'Bayam',e:'🥬',w:1,f:10,s:1,fn:'Nitrogen/kompos cair',wn:'Siram ringan pagi-sore, jangan becek'},
{id:'terongbulat',n:'Terong Bulat',e:'🟢',w:1,f:14,s:1,fn:'NPK seimbang, tambah kalium saat berbuah',wn:'Siram di pangkal, tanah lembap tidak becek'},
{id:'kemangi',n:'Kemangi',e:'🌱',w:2,f:14,s:1,fn:'Kompos/organik cair',wn:'Siram sedang, jangan tergenang'},
{id:'buncis',n:'Buncis',e:'🫘',w:1,f:10,s:1,fn:'Organik + NPK rendah nitrogen',wn:'Siram pagi di pangkal, jangan becek'},
{id:'kacangpanjang',n:'Kacang Panjang',e:'🌾',w:1,f:10,s:1,fn:'Organik + NPK rendah nitrogen, kalium saat berbunga',wn:'Siram pagi di pangkal, jangan becek'},
{id:'seledri',n:'Seledri',e:'🍃',w:1,f:10,s:1,fn:'Nitrogen/kompos cair',wn:'Siram tiap hari, tanah selalu lembap'},
{id:'pepaya',n:'Pepaya',e:'🟠',w:2,f:21,s:1,fn:'NPK + organik; kalium + boron saat berbuah',wn:'Siram di sekitar pangkal, jangan tergenang'}];

try{var r=localStorage.getItem('kebun1');if(r)S=JSON.parse(r)}catch(e){}
DEF.forEach(function(d){if(!S.plants.some(function(p){return p.id==d.id}))S.plants.push(JSON.parse(JSON.stringify(d)))});
S.alarms=S.alarms||[];function mig(){S.stok=S.stok||[];var RM=['mangga','lengkeng','jeruk','durian','rambutan','belimbing','nangka'];S.cash=S.cash||[];S.cash.forEach(function(c){if(RM.indexOf(c.p)>=0){c.n='['+c.p.charAt(0).toUpperCase()+c.p.slice(1)+'] '+c.n;c.p='umum'}});S.logs=S.logs.filter(function(l){return RM.indexOf(l.p)<0});S.plants=S.plants.filter(function(p){return RM.indexOf(p.id)<0})}

function save(){try{localStorage.setItem('kebun1',JSON.stringify(S))}catch(e){}}
function key(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pd(k){var a=k.split('-');return new Date(+a[0],a[1]-1,+a[2])}
function diff(a,b){return Math.round((pd(a)-pd(b))/864e5)}
function fmt(k){return pd(k).toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var T=key(),TN={w:'Siram',f:'Pupuk'};

function doneToday(p,t){return S.logs.some(function(l){return l.p==p&&l.t==t&&l.d==T})}
function toggle(pid,t){var i=-1;S.logs.forEach(function(l,j){if(l.p==pid&&l.t==t&&l.d==T)i=j});if(i>=0)S.logs.splice(i,1);else S.logs.push({p:pid,t:t,d:T});save();draw()}
function nm(id){return S.plants.filter(function(p){return p.id==id})[0]}
function tabsH(){var L={h:'✅ Hari Ini',a:'⏰ Alarm',p:'🔍 Pantau',j:'📅 Jadwal',d:'🌱 Data Tanaman',c:'📒 Catatan',k:'💰 Kas',g:'📚 Panduan',l:'📄 Laporan'},h='';for(var k in L)h+='<button class="'+(k==tab?'on':'')+'" onclick="tab=\''+k+'\';draw()">'+L[k]+'</button>';return h}

function viewH(){
var due=tasks().filter(function(x){return PL().indexOf(x.p)>=0&&(diff(x.nx,T)<=0||doneToday(x.p.id,x.t))}).sort(function(a,b){return a.nx<b.nx?-1:1}),h='';

var tot=due.length,dn=due.filter(function(x){return doneToday(x.p.id,x.t)}).length;
return extraH()+'<div class="card"><b>Progres: '+dn+' / '+tot+'</b></div>'+h}
var KD=['Baik','Rontok sedikit','Rontok banyak','Ada hama','Ada penyakit/busuk','Buah pecah','Layu / menguning'];
function viewP(){var h='';PL().forEach(function(p){var m=S.logs.filter(function(l){return l.p==p.id&&l.t=='m'}).sort(function(a,b){return a.d<b.d?-1:1}),lm=m[m.length-1];
h+='<div class="card"><div class="t">'+p.e+' '+p.n+'</div><div class="m">'+(lm?'Terakhir '+fmt(lm.d)+': '+esc(lm.c)+(lm.n?' - '+esc(lm.n):''):'Belum ada catatan')+'</div><select id="c_'+p.id+'">'+KD.map(function(k){return'<option>'+k+'</option>'}).join('')+'</select><input type="text" id="n_'+p.id+'" placeholder="Catatan (opsional)"><button class="btn" onclick="mon(\''+p.id+'\')">Simpan kondisi</button></div>'});return h}
function mon(id){S.logs.push({p:id,t:'m',d:T,c:document.getElementById('c_'+id).value,n:document.getElementById('n_'+id).value.trim()});save();draw()}
function viewJ(){var h='<div class="m">Atur interval (hari). Sesuaikan dengan cuaca dan kondisi tanah.</div><button class="btn" onclick="startW()">▶ Mulai siram hari ini (semua tanaman)</button>';PL().forEach(function(p){
h+='<div class="card"><div class="t">'+p.e+' '+p.n+'</div><div class="sm"><div><label>Siram tiap (hari)</label><input type="number" min="1" value="'+p.w+'" onchange="setI(\''+p.id+'\',\'w\',this.value)"></div><div><label>Pupuk tiap (hari)</label><input type="number" min="1" value="'+p.f+'" onchange="setI(\''+p.id+'\',\'f\',this.value)"></div></div><div class="m" style="margin-top:6px">Siram: '+stat(nextD(p,'w'))+'<br>Pupuk: '+stat(nextD(p,'f'))+'<br>Jenis pupuk: '+esc(p.fn)+'</div><button class="btn" style="background:#2b2210" onclick="startW(\''+p.id+'\')">▶ Mulai siram hari ini</button> <button class="btn" style="background:#4a0d14" onclick="startW(\''+p.id+'\',\'f\')">▶ Mulai pupuk hari ini</button></div>'});return h}
function tot(p){var t=0,n=0;S.logs.forEach(function(l){if(l.p==p.id&&l.t=='k'){t+=+l.kg;n++}});return n?Math.round(t*10)/10:null}
function hs(p){var t=tot(p);return t!==null?t:(p.h===undefined||p.h===''?null:+p.h)}
function avg(p){var j=+p.j,h=hs(p);return j>0&&h!==null?(h/j).toFixed(1).replace('.0','')+' kg/tanaman':'-'}
function viewD(){var h='<div class="m">Isi manual jumlah tanaman dan hasil panen (kg). Jika ada Catatan Panen, total hasil dihitung otomatis dari catatan itu. Rata-rata per tanaman dihitung otomatis.</div>';PL().forEach(function(p){
h+='<div class="card"><div class="t">'+p.e+' '+p.n+'</div><div class="sm"><div><label>Jumlah tanaman</label><input type="number" min="0" inputmode="numeric" placeholder="Isi jumlah" value="'+(p.j||'')+'" oninput="setJ(\''+p.id+'\',this.value)"></div><div><label>Hasil panen manual (kg)</label><input type="number" min="0" step="0.1" inputmode="decimal" placeholder="Isi hasil" value="'+(p.h===undefined?'':p.h)+'" oninput="setH(\''+p.id+'\',this.value)"></div></div>'+TTH(p)+'<div class="m" style="margin-top:6px">Rata-rata: <b id="a_'+p.id+'">'+avg(p)+'</b></div></div>'});return h}
function upA(id){var e=document.getElementById('a_'+id);if(e)e.textContent=avg(nm(id))}
function setH(id,v){nm(id).h=v===''?'':Math.max(0,parseFloat(v)||0);save();upA(id)}
function setJ(id,v){nm(id).j=v===''?'':Math.max(0,parseInt(v)||0);save();upA(id)}
function startW(id,t){t=t||'w';var a=id?[nm(id)]:S.plants;a.forEach(function(p){p.o=p.o||{};p.o[t]=T});save();tab='h';draw()}
function setI(id,t,v){v=Math.max(1,parseInt(v)||1);nm(id)[t]=v;save();draw()}
var FK='';
function rep(){var from=new Date();from.setDate(from.getDate()-range+1);var fk=FK=key(from),R=[];
var lo=S.logs.filter(function(l){return l.d>=fk&&l.d<=T&&nm(l.p)}),c=function(t){return lo.filter(function(l){return l.t==t}).length},kg=0;lo.forEach(function(l){if(l.t=='k')kg+=+l.kg});
var late=tasks().filter(function(x){return diff(x.nx,T)<0}),up=tasks().filter(function(x){var d=diff(x.nx,T);return d>=0&&d<=3});
R.push(['sec','📊 RINGKASAN']);R.push(['ln','Penyiraman: '+c('w')+' kali']);R.push(['ln','Pemupukan: '+c('f')+' kali']);R.push(['ln','Pemantauan: '+c('m')+' catatan']);R.push(['ln','Pupuk/obat: '+c('i')+' catatan']);R.push(['ln','Panen: '+(Math.round(kg*10)/10)+' kg']);R.push(['ln','Tugas terlambat: '+late.length]);
var ci=0,co=0;S.cash.forEach(function(c){if(c.d>=fk&&c.d<=T){if(c.t=='in')ci+=c.a;else co+=c.a}});R.push(['sec','💰 KEUANGAN']);R.push(['ln','Pendapatan: '+rp(ci)]);R.push(['ln','Pengeluaran: '+rp(co)]);R.push(['ln','Laba bersih: '+rp(ci-co)]);R.push(['sec','✅ KEGIATAN']);var days={};lo.forEach(function(l){(days[l.d]=days[l.d]||[]).push(l)});var ks=Object.keys(days).sort();
if(!ks.length)R.push(['ln','Belum ada kegiatan tercatat.']);
ks.forEach(function(k){R.push(['day',fmt(k)]);days[k].forEach(function(l){R.push(['ln',lg(l,nm(l.p)).replace(/^ \S+ /,'')])})});
var jp=S.plants.filter(function(p){return (p.j!==undefined&&p.j!=='')||(hs(p)!==null)});
if(jp.length){R.push(['sec','🌱 DATA TANAMAN & HASIL']);jp.forEach(function(p){R.push(['ln',p.n+': '+(p.j||0)+' tanaman, hasil '+(hs(p)||0)+' kg (rata-rata '+avg(p)+')'])})}
if(late.length){R.push(['sec','⚠️ PERLU PERHATIAN']);late.forEach(function(x){R.push(['ln',TN[x.t]+' '+x.p.n+' terlambat '+(-diff(x.nx,T))+' hari'])})}
if(up.length){R.push(['sec','📌 JADWAL HARI INI & 3 HARI KE DEPAN']);up.forEach(function(x){R.push(['ln',TN[x.t]+' '+x.p.n+' ('+fmt(x.nx)+')'])})}
return R}
function report(){var R=rep(),L=['━━━━━━━━━━━━━━━━━━','🌳 *LAPORAN KEBUN HORTI KALTENG*','━━━━━━━━━━━━━━━━━━','Periode : '+fmt(FK)+' - '+fmt(T),'Dibuat  : '+new Date().toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'})];
R.forEach(function(r){if(r[0]=='sec'){L.push('');L.push('*'+r[1]+'*')}else if(r[0]=='day')L.push('📅 '+r[1]);else L.push('   • '+r[1])});
L.push('');L.push('──────────────────');L.push('_by BTN165 (Kang Malvie)_');return L.join('\n')}
function imgR(){var R=rep(),W=720,P=36,tc=document.createElement('canvas').getContext('2d'),rows=[];tc.font='20px sans-serif';
function wrap(t,x,type){var w=t.split(' '),l='';w.forEach(function(q){var n=l?l+' '+q:q;if(tc.measureText(n).width>W-P*2-x&&l){rows.push([type,l,x]);l=q}else l=n});rows.push([type,l,x])}
R.forEach(function(r){if(r[0]=='sec')rows.push(['sec',r[1],0,1]);else if(r[0]=='day')rows.push(['day',r[1],0]);else wrap('• '+r[1],14,'ln')});
var H=150+rows.length*32+rows.filter(function(r){return r[0]=='sec'}).length*18+110,cv=document.createElement('canvas');cv.width=W;cv.height=H;var c=cv.getContext('2d');
c.fillStyle='#0b0b0d';c.fillRect(0,0,W,H);c.fillStyle='#7a0c14';c.fillRect(0,0,W,120);c.fillStyle='#d4af37';c.fillRect(0,120,W,4);c.fillStyle='#f3d98b';c.font='bold 30px sans-serif';c.fillText('🌳 LAPORAN KEBUN HORTI KALTENG',P,56);c.font='20px sans-serif';c.fillText('Periode: '+fmt(FK)+' - '+fmt(T),P,92);
var y=160;rows.forEach(function(r){if(r[0]=='sec'){y+=14;c.fillStyle='#d4af37';c.font='bold 22px sans-serif';c.fillText(r[1],P,y);c.fillRect(P,y+6,W-P*2,2);y+=32}else{c.fillStyle=r[0]=='day'?'#f3d98b':'#e6dcc3';c.font=(r[0]=='day'?'bold ':'')+'20px sans-serif';c.fillText(r[1],P+r[2],y);y+=32}});
c.fillStyle='#4a3a1a';c.fillRect(P,H-86,W-P*2,2);c.textAlign='center';c.fillStyle='#d4af37';c.font='bold 22px sans-serif';c.fillText('by BTN165 (Kang Malvie)',W/2,H-50);c.fillStyle='#a89a78';c.font='16px sans-serif';c.fillText('Persembahan BTN165 - Kang Malvie Official',W/2,H-24);
cv.toBlob(function(b){try{var f=new File([b],'laporan-kebun.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Laporan Kebun Horti Kalteng'}).catch(function(){});return}}catch(e){}
